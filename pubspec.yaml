name: organ_donation_app
description: A new Flutter project for organ donation management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  url_launcher: ^6.1.14
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  permission_handler: ^10.2.0
  firebase_core: ^2.32.0
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  cloud_firestore: ^4.13.6
  firebase_database: ^10.4.0
  firebase_auth: ^4.15.3
  firebase_auth_web: ^5.8.12
  firebase_core_web: ^2.10.0
  flutter_chat_bubble: ^2.0.0
  js: ^0.6.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  assets:

  fonts:
    - family: Roboto
      fonts:

  # Enable compression
  uses-material-design: true
  generate: true
  
  # Remove the assets and fonts sections since we're using google_fonts
  # and don't have any local images yet
